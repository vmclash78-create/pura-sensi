name: Lighthouse performance audit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Optimize logo image
        run: |
          if [ ! -f src/assets/logo-purasensi.webp ]; then
            npm install --no-save --package-lock=false --no-audit --no-fund sharp
            node --input-type=module -e 'import sharp from "sharp"; await sharp("src/assets/logo-purasensi.png").webp({ quality: 88, alphaQuality: 100, effort: 6 }).toFile("src/assets/logo-purasensi.webp");'
            ls -lh src/assets/logo-purasensi.png src/assets/logo-purasensi.webp
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/assets/logo-purasensi.webp
            git commit -m "Add optimized WebP logo"
            git push origin HEAD:main
          fi

      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'lighthouse-placeholder-key' }}

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:4173/
          uploadArtifacts: true
          temporaryPublicStorage: false
          runs: 1
