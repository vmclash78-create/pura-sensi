name: Optimize logo asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-logo.yml"
      - "src/assets/logo-purasensi.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install image optimizer
        run: npm install --no-save --package-lock=false --no-audit --no-fund sharp

      - name: Convert logo to optimized WebP
        run: |
          node --input-type=module -e 'import sharp from "sharp"; await sharp("src/assets/logo-purasensi.png").webp({ quality: 88, alphaQuality: 100, effort: 6 }).toFile("src/assets/logo-purasensi.webp");'
          ls -lh src/assets/logo-purasensi.png src/assets/logo-purasensi.webp

      - name: Commit optimized asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/logo-purasensi.webp
          if git diff --cached --quiet; then
            echo "Optimized logo is already up to date."
          else
            git commit -m "Add optimized WebP logo"
            git push origin HEAD:main
          fi
